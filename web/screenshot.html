<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLT Screen Shots</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --primary-color: #3b82f6;
            --secondary-color: #1e293b;
            --accent-color: #06b6d4;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg-color), var(--secondary-color));
            color: var(--text-color);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .card img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            background: var(--primary-color);
            color: white;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            background: var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PLT Screen Shots</h1>
            <p>Examples of modern graphical output generated by PLT.</p>
        </header>

        <div class="card">
            <img src="images/screenshot1.jpg" alt="Complex Sine Wave Plot">
            <h3>Complex Sine Wave</h3>
            <p>Example of high-resolution line plots with custom color palettes and grid styling.</p>
        </div>

        <div class="card">
            <img src="images/screenshot2.jpg" alt="Colorful Histogram Plot">
            <h3>Glassmorphism Histogram</h3>
            <p>Example of advanced shaded bar charts, error bars, and legend positioning.</p>
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="btn">Back to Home</a>
        </div>
    </div>
</body>
</html>
